<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111827" />
    <title>Sem conexão - Sistema Financeiro</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, Arial, sans-serif;
        background: #f8fafc;
        color: #111827;
      }
      main {
        width: min(100%, 460px);
        padding: 32px;
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 12px 36px rgba(15, 23, 42, 0.10);
        text-align: center;
      }
      h1 { margin-top: 0; font-size: 1.6rem; }
      p { color: #475569; line-height: 1.6; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: #111827;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está offline</h1>
      <p>A conexão com a internet foi perdida. As telas e arquivos já armazenados continuam disponíveis quando possível.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
