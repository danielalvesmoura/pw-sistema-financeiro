spring.application.name=financeiro-backend
server.port=8080

# Banco de dados
# Usuario root e senha vazia continuam disponiveis como padrao apenas para desenvolvimento local.
# Em deploy, configure as variaveis abaixo no ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/financeiro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Obrigatorio: defina JWT_SECRET no ambiente com pelo menos 32 caracteres.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
# Separe multiplas origens por virgula. Nao use "*" quando credentials estiver habilitado.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Recuperacao de senha
# O token so deve ser exposto em ambiente local de desenvolvimento.
app.security.expose-reset-token=${EXPOSE_RESET_TOKEN:false}

springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health

# Integracao com Gemini
# Configure a chave em uma variavel de ambiente. Nao coloque segredos no repositorio.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
